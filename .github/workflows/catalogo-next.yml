name: Catálogo Next.js

on:
  push:
    paths:
      - livros-next/**
      - .github/workflows/catalogo-next.yml
  pull_request:
    paths:
      - livros-next/**
      - .github/workflows/catalogo-next.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogo-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes, build e API HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: livros-next
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: livros-next/package-lock.json
      - name: Testar contratos dos handlers e controles
        run: npm test
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Compilar e verificar tipos
        run: npm run build
      - name: Verificar inclusão, listagem e exclusão pelo servidor Next real
        run: npm run test:http
      - name: Compilar a demonstração por visitante
        run: npm run build:demo
      - name: Conferir API de consulta e bloqueio de mutações no modo público
        run: npm run test:demo:http
